<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy-Paste Helper</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #121212;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        h1 {
            color: #ffffff;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 100%;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            background-color: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #6c5ce7;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        #copy-btn {
            background-color: #6c5ce7;
            color: white;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        #copy-btn:hover {
            background-color: #5d4ec9;
        }

        #paste-btn {
            background-color: #00b894;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.4);
        }

        #paste-btn:hover {
            background-color: #00a383;
        }

        #status {
            margin-top: 15px;
            color: #00d2d3;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            min-height: 24px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #status.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <h1> Copy-Paste Helper</h1>
    
    <div class="container">
        <textarea id="textArea" placeholder="Enter or paste text here..."></textarea>
        
        <div class="button-group">
            <button id="copy-btn"> Copy Text</button>
            <button id="paste-btn"> Paste Text</button>
        </div>
        
        <div id="status"></div>
    </div>

    <script>
        const textArea = document.getElementById('textArea');
        const copyBtn = document.getElementById('copy-btn');
        const pasteBtn = document.getElementById('paste-btn');
        const statusDiv = document.getElementById('status');

        function showStatus(message) {
            statusDiv.textContent = message;
            statusDiv.classList.add('show');
            setTimeout(() => {
                statusDiv.classList.remove('show');
            }, 2000);
        }

        // Copy button functionality
        copyBtn.addEventListener('click', async () => {
            if (textArea.value.trim() === '') {
                showStatus(' Nothing to copy!');
                return;
            }

            try {
                await navigator.clipboard.writeText(textArea.value);
                showStatus(' Copied!');
            } catch (err) {
                showStatus(' Failed to copy');
                console.error('Copy error:', err);
            }
        });

        // Paste button functionality
        pasteBtn.addEventListener('click', async () => {
            try {
                const clipboardText = await navigator.clipboard.readText();
                textArea.value = clipboardText;
                showStatus(' Pasted!');
            } catch (err) {
                showStatus(' Failed to paste');
                console.error('Paste error:', err);
            }
        });
    </script>
</body>

</html>
